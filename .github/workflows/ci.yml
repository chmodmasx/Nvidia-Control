name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build daemon for IPC test
        run: cargo build -p nvidia-control-daemon

      - name: D-Bus smoke test with mock GPU
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            NVIDIA_CONTROL_BACKEND=mock target/debug/nvidia-control-daemon --session &
            daemon=$!
            trap "kill $daemon 2>/dev/null || true" EXIT

            for i in $(seq 1 40); do
              if busctl --user call io.github.chmodmasx.NvidiaControl \
                /io/github/chmodmasx/NvidiaControl \
                io.github.chmodmasx.NvidiaControl1 GetApiVersion >version.txt 2>/dev/null; then
                break
              fi
              sleep 0.25
            done

            grep -q "u 1" version.txt
            busctl --user call io.github.chmodmasx.NvidiaControl \
              /io/github/chmodmasx/NvidiaControl \
              io.github.chmodmasx.NvidiaControl1 GetSnapshot >snapshot.txt
            grep -q "GPU-MOCK-0000" snapshot.txt
            grep -q "operating_limits" snapshot.txt

            busctl --user call io.github.chmodmasx.NvidiaControl \
              /io/github/chmodmasx/NvidiaControl \
              io.github.chmodmasx.NvidiaControl1 GetInventory >inventory.txt
            grep -q "GPU-MOCK-0000" inventory.txt
            grep -q "operating_limits" inventory.txt
            if grep -q "\\"telemetry\\"" inventory.txt; then exit 1; fi

            busctl --user call io.github.chmodmasx.NvidiaControl \
              /io/github/chmodmasx/NvidiaControl \
              io.github.chmodmasx.NvidiaControl1 GetTelemetry us 0 GPU-MOCK-0000 >telemetry.txt
            grep -q "gpu_util_percent" telemetry.txt
            if grep -q "operating_limits" telemetry.txt; then exit 1; fi
          '

  qt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick-templates

      - name: Configure UI
        run: cmake -S ui -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build UI
        run: cmake --build build/ui --parallel 2

      - name: History module unit tests
        run: ctest --test-dir build/ui --output-on-failure

      - name: Headless QML startup smoke test
        run: |
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            ./build/ui/nvidia-control >ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          sleep 3
          if ! kill -0 "$ui_pid" 2>/dev/null; then
            cat ui.log
            exit 1
          fi
          if grep -Eq 'QQmlApplicationEngine failed|module .* is not installed|Type .* unavailable' ui.log; then
            cat ui.log
            exit 1
          fi
