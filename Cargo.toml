[workspace]
members = [
    "crates/control-core",
    "crates/backend-mock",
    "crates/backend-nvml",
    "crates/control-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
nvml-wrapper = "0.13.0"
nvidia-control-core = { path = "crates/control-core" }
